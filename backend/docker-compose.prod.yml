# Production docker-compose
# ⚠️  Credentials NOT stored here.
# Inject via environment variables from your cloud secret manager:
#   - AWS Secrets Manager / Parameter Store
#   - GCP Secret Manager
#   - Azure Key Vault
#   - GitHub Actions secrets (for CI/CD deployment)
#
# Example: docker compose -f docker-compose.prod.yml up -d
# All ${VAR} below must be set in the environment before running.

services:
  api:
    image: dikhean/simulate-api:latest
    container_name: simulate-api
    networks:
      - my-net
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAZE_SERVICE_URL: http://maze-service:3000
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH}
      PUBLIC_KEY_PATH: ${PUBLIC_KEY_PATH}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      GIN_MODE: release
    depends_on:
      redis:
        condition: service_healthy
      maze-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

  maze-service:
    image: dikhean/maze-generate:latest
    container_name: maze-service
    networks:
      - my-net
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/maze/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - my-net
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "no"
      - --protected-mode
      - "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - my-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  mongo:
    image: mongo:7
    container_name: mongo
    networks:
      - my-net
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - my-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

networks:
  my-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  minio-data:
