server:
  port: 8080

rate_limit:
  enabled: true
  rps: 5
  burst: 10

redis:
  enabled: true
  addr: ""
  password: ""
  db: 0

maze_service:
  url: "http://localhost:3000"


log:
  level: info
  format: json
  output: stdout

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "https://high-contention-resource-allocation.vercel.app"
    - "https://www.eddiekhean.site"
    - "https://eddiekhean.site"
    - "https://www.eddiekhean.site/"

jwt:
  signing_method: RS256
  private_key_path: "key/private.pem"
  public_key_path: "key/public.pem"
  access_token_ttl: 900
  refresh_token_ttl: 604800

# Values below are overridden by env vars at runtime (see .env.example)
postgres:
  dsn: "" # set via POSTGRES_DSN env var

mongo:
  uri: ""      # set via MONGO_URI env var
  database: "app_db"